name: Playwright config-flow smoke (reusable)

# Boots a REAL Home Assistant instance in CI, installs this integration into
# its custom_components/, and drives the "Add Integration -> Polygonal Zones"
# config flow in a browser. Shared by playwright.yml (stable HA, on
# push/PR/schedule) and nightly-beta.yml (latest HA prerelease, ADR 0002) so
# the install/boot/drive recipe is defined once. See playwright.yml's own
# header comment for why this is heavyweight and not wired into branch
# protection.

on:
  workflow_call:
    inputs:
      ha_version:
        description: "Exact homeassistant version to install. Empty (default) installs the range declared in requirements_test.txt."
        required: false
        type: string
        default: ""
      artifact_suffix:
        description: "Suffix for the uploaded Playwright report artifact name, so parallel callers don't collide."
        required: false
        type: string
        default: ""
      continue_on_error:
        description: "Non-blocking on PRs only (a job calling a reusable workflow can't set continue-on-error itself, so the caller passes it through as an input instead)."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  config-flow:
    name: Config flow (Playwright)
    runs-on: ubuntu-latest
    continue-on-error: ${{ inputs.continue_on_error }}
    env:
      HA_URL: "http://127.0.0.1:8123"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Home Assistant + runtime deps
        run: |
          set -eux
          # requirements_test.txt is the single source of truth for the shapely
          # range (Renovate tracks it) - read from it rather than duplicating
          # the range here, where a Renovate-driven cap bump would go unseen.
          # The homeassistant version is either the caller's exact pin
          # (nightly-beta.yml, an HA prerelease) or, if empty, the declared
          # range (this workflow's normal push/PR/schedule callers).
          if [ -n "${{ inputs.ha_version }}" ]; then
            HA_REQ="homeassistant==${{ inputs.ha_version }}"
          else
            HA_REQ=$(grep -E '^homeassistant' requirements_test.txt)
          fi
          SHAPELY_REQ=$(grep -E '^shapely' requirements_test.txt)
          pip install "$HA_REQ" "$SHAPELY_REQ"
          # `pip install homeassistant` does NOT pull integration requirements
          # (HA installs them at runtime, which is not effective in this CI), so
          # the frontend package (hass_frontend) and the auto-loaded assist/media
          # stack are all absent. The SPA's initial load calls get_services,
          # which imports every services.yaml-bearing integration to describe its
          # services; any that can't import make get_services error and the UI
          # hangs forever on "Loading data". Pre-install the pinned requirements
          # of the frontend + that stack, read straight from each component's
          # manifest (so versions match this HA build) and resolved in one pip
          # pass. Components absent in this HA version are skipped. Only the
          # Python modules are needed — get_services imports them to read service
          # descriptions but never instantiates them, so no system libs (the
          # ffmpeg binary, libturbojpeg) are required just to clear "Loading data".
          python - <<'PY' > /tmp/ha-reqs.txt
          import json, pathlib, homeassistant
          base = pathlib.Path(homeassistant.__path__[0]) / "components"
          # `hassio` is here for its requirement (aiohasupervisor), not to run it:
          # on recent HA cores `analytics` imports `homeassistant.components.hassio`
          # at module load, so when get_services imports analytics to read its
          # service descriptions, a missing aiohasupervisor raises ModuleNotFound,
          # get_services errors, and the SPA hangs forever on "Loading data" →
          # the smoke times out. Pre-installing hassio's pinned requirement fixes it.
          comps = (
              "frontend recorder conversation assist_pipeline tts ffmpeg camera "
              "analytics hassio ai_task image_processing met radio_browser google_translate"
          ).split()
          reqs = []
          for c in comps:
              m = base / c / "manifest.json"
              if m.exists():
                  reqs += json.loads(m.read_text()).get("requirements", [])
          print("\n".join(sorted(set(reqs))))
          PY
          echo "Pre-installing integration requirements:"
          cat /tmp/ha-reqs.txt
          pip install -r /tmp/ha-reqs.txt

      - name: Stage HA config dir with the integration installed
        run: |
          set -eux
          HA_CONFIG="$RUNNER_TEMP/ha-config"
          mkdir -p "$HA_CONFIG/custom_components"
          cp -r custom_components/polygonal_zones "$HA_CONFIG/custom_components/"
          # Minimal config rather than `default_config`. default_config drags in
          # dozens of optional integrations (cloud, bluetooth, stream, camera,
          # assist_pipeline, mobile_app, …) whose system/Python deps (ffmpeg,
          # usb, turbojpeg, aiohasupervisor, …) aren't present in a bare pip
          # install, so default_config's setup *fails* and floods the log. The
          # smoke only needs the SPA shell (`frontend`) and the integrations
          # config panel (`config`); `onboarding` and `websocket_api`/`http`
          # load automatically (bootstrap + frontend deps).
          printf 'frontend:\nconfig:\n' > "$HA_CONFIG/configuration.yaml"
          echo "HA_CONFIG=$HA_CONFIG" >> "$GITHUB_ENV"

      - name: Start Home Assistant
        run: |
          set -eux
          nohup hass --config "$HA_CONFIG" --log-file "$RUNNER_TEMP/ha.log" >/dev/null 2>&1 &
          echo "HA_PID=$!" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run config-flow smoke
        working-directory: tests/e2e
        run: npx playwright test

      - name: Dump Home Assistant log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/ha.log" || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report${{ inputs.artifact_suffix }}
          path: tests/e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7
