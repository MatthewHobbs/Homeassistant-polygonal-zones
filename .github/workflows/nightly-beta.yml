name: Nightly HA beta

# HA ships a beta a week before each final release, and breaking API changes land
# there first. This runs the pytest suite against the latest in-range HA prerelease, in
# its own cache namespace, on a schedule. A red run means the beta broke something; it
# is never required.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# See validate.yml for why the key includes github.workflow. Never
# push/pull_request-triggered, so cancel-in-progress is unconditionally false.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolves the latest in-range HA prerelease and whether it's already been
  # tested. pytest-beta installs exactly gate's ha_version
  # output (never re-queries PyPI itself) so the version it actually tests
  # can never drift from the fingerprint that record later marks as passing.
  gate:
    uses: ./.github/workflows/_upstream-gate.yml
    with:
      cache_prefix: nightly-beta
      include_prereleases: true

  pytest-beta:
    name: Pytest (HA beta)
    needs: [gate]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.gate.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install deps (HA beta ${{ needs.gate.outputs.ha_version }} in place of the pinned range)
        env:
          EXPECTED_HA: ${{ needs.gate.outputs.ha_version }}
        run: |
          set -euo pipefail
          grep -vE '^homeassistant' requirements_test.txt > /tmp/requirements_test.no-ha.txt
          pip install -r /tmp/requirements_test.no-ha.txt
          pip install "homeassistant==${EXPECTED_HA}"
          pip show homeassistant
          python -c 'import os, homeassistant.const as c; assert c.__version__ == os.environ["EXPECTED_HA"], (c.__version__, os.environ["EXPECTED_HA"])'
      - run: pytest --cov=custom_components/polygonal_zones --cov-report=term --cov-fail-under=98

  # PHACC pins a stable HA release and never publishes beta builds. Install the
  # latest PHACC first, then override homeassistant to gate's version; skip
  # explicitly with a notice only if PHACC's own plugin fails to import.
  pytest-hass-beta:
    name: Pytest (real hass, HA beta)
    needs: [gate]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.gate.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test_hass.txt
      - name: Install real-hass deps with HA ${{ needs.gate.outputs.ha_version }}
        id: install
        env:
          EXPECTED_HA: ${{ needs.gate.outputs.ha_version }}
        run: |
          set -euo pipefail
          sed -E 's/^(pytest-homeassistant-custom-component|homeassistant)==.*/\1/' requirements_test_hass.txt > /tmp/requirements_test_hass.unpinned.txt
          pip install -r /tmp/requirements_test_hass.unpinned.txt
          pip install "$(grep -E '^shapely' requirements_test.txt)"
          if ! pip install "homeassistant==${EXPECTED_HA}"; then
            echo "::notice::Could not install homeassistant==${EXPECTED_HA} alongside pytest-homeassistant-custom-component; skipping tests_hass."
            echo "compatible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pip show homeassistant pytest-homeassistant-custom-component
          python -c 'import os, homeassistant.const as c; assert c.__version__ == os.environ["EXPECTED_HA"], (c.__version__, os.environ["EXPECTED_HA"])'
          if ! python -c 'import pytest_homeassistant_custom_component.plugins, pytest_homeassistant_custom_component.common'; then
            echo "::notice::No pytest-homeassistant-custom-component release supports homeassistant==${EXPECTED_HA} yet; skipping tests_hass."
            echo "compatible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "compatible=true" >> "$GITHUB_OUTPUT"
      - name: Run real-hass suite against HA ${{ needs.gate.outputs.ha_version }}
        if: steps.install.outputs.compatible == 'true'
        run: pytest tests_hass -p homeassistant

  mypy-beta:
    name: Mypy (HA beta)
    needs: [gate]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.gate.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install deps (HA beta ${{ needs.gate.outputs.ha_version }} in place of the pinned range)
        env:
          EXPECTED_HA: ${{ needs.gate.outputs.ha_version }}
        run: |
          set -euo pipefail
          grep -vE '^homeassistant' requirements_test.txt > /tmp/requirements_test.no-ha.txt
          pip install -r /tmp/requirements_test.no-ha.txt
          pip install "homeassistant==${EXPECTED_HA}"
          pip show homeassistant
          python -c 'import os, homeassistant.const as c; assert c.__version__ == os.environ["EXPECTED_HA"], (c.__version__, os.environ["EXPECTED_HA"])'
      - run: mypy

  # Record the tested fingerprint only when every job passed (see
  # _upstream-gate.yml) - a failed beta run is NOT recorded, so it keeps
  # re-alerting nightly until fixed rather than caching a broken fingerprint
  # and going silently green.
  record:
    needs: [gate, pytest-beta, pytest-hass-beta, mypy-beta]
    if: ${{ needs.gate.outputs.changed == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ needs.gate.outputs.cache_key }}" > .upstream-fingerprint
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .upstream-fingerprint
          key: ${{ needs.gate.outputs.cache_key }}
