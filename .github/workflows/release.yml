name: Release

on:
  release:
    types: [published]
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Nothing by default: each job asks for what it needs. The job that mints the
# attestation holds the OIDC token but cannot write to the release; the job that
# writes to the release cannot mint an attestation, and checks the zip against the
# attestation before uploading it.
permissions: {}

jobs:
  build:
    name: Build and attest the integration zip
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # Required for actions/attest-build-provenance to mint a Sigstore
      # bundle signed with the repo's OIDC identity — lets installers
      # verify the uploaded zip came from this exact workflow run without
      # needing a long-lived GPG key.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Validate workflow succeeded on this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          STATUS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/validate.yml/runs?head_sha=$GITHUB_SHA" \
            --jq '.workflow_runs | map(select(.conclusion == "success")) | length')
          if [ "$STATUS" -eq 0 ]; then
            echo "::error::Validate workflow has not completed successfully on $GITHUB_SHA. Refusing to release."
            exit 1
          fi

      - name: Verify manifest version matches tag
        # workflow_dispatch has no tag (GITHUB_REF_NAME is the branch) — this
        # check only makes sense for a real release publish.
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(jq -r .version custom_components/polygonal_zones/manifest.json)
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag version $TAG_VERSION does not match manifest version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Create integration zip
        run: |
          cd custom_components/polygonal_zones
          zip -r "$GITHUB_WORKSPACE/polygonal_zones.zip" .

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: polygonal_zones.zip

      - name: Hand the zip to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-zip
          path: polygonal_zones.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Verify the zip and attach it to the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Fetch the zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: integration-zip

      - name: Verify the zip is the attested one
        # Runs on a dry run too: this is the check that the bytes about to be
        # published are the bytes the build job attested, from this workflow.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify polygonal_zones.zip \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"

      - name: Upload zip to release
        # A manual dispatch run has no corresponding release object to attach
        # to — exercising build + attestation is the point of a dry run, not
        # publishing anything, so this step never runs outside a real release.
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: polygonal_zones.zip
