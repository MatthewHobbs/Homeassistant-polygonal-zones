name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# Cancel a superseded review when new commits are pushed to the same PR. Without
# this, every push (`synchronize`) starts a fresh Claude review while the prior
# one keeps running — each consuming Anthropic API credits (the one metered cost
# on this public repo, where Actions minutes are free).
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Dependabot PRs run against Dependabot's own secret store, which does not
    # contain this repo's Actions secrets — CLAUDE_CODE_OAUTH_TOKEN resolves to
    # an empty string and the job fails every time. It is not a required check,
    # so nothing was ever blocked, but a permanently-red check on every
    # dependency PR trains reviewers to ignore red. Skip rather than fail.
    if: github.actor != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Claude Code refuses a local copy of the reserved `claude-code-plugins`
      # marketplace, and the action's marketplace URL cannot carry a ref. So
      # pin the plugin by checking it out at a commit and loading it with
      # --plugin-dir, bypassing marketplaces.
      - name: Checkout code-review plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anthropics/claude-code
          ref: a6e289a2e772a17b3614a9ef43303003de5cd887
          path: .claude-plugin-src
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--model opus --plugin-dir ./.claude-plugin-src/plugins/code-review'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

