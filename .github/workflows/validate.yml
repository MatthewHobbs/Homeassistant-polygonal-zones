name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# Concurrency groups are repo-global, not workflow-scoped, so the key includes
# github.workflow to avoid colliding with other workflows' groups. Only PR runs
# cancel in place: cancelling a push-to-main run would leave that squash-merge
# SHA without a passing Validate run, and release.yml refuses to release a SHA
# with zero successful Validate runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # On schedule/dispatch, decide whether upstream (latest in-range HA + shapely)
  # has changed since the last passing nightly. push/PR never gate — code changes
  # always get the full suite (these jobs are the branch-protection required checks).
  gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_upstream-gate.yml
    with:
      cache_prefix: validate

  hassfest:
    name: Hassfest
    needs: [gate]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request' || needs.gate.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

  hacs:
    name: HACS
    needs: [gate]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request' || needs.gate.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  ruff:
    name: Ruff (lint + format)
    needs: [gate]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request' || needs.gate.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: "check --output-format=github"
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: "format --check --diff"

  prettier:
    name: Prettier
    needs: [gate]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request' || needs.gate.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npx --yes prettier@3 --check "**/*.{json,yaml,yml,md}"

  pytest:
    name: Pytest
    needs: [gate]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request' || needs.gate.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: pytest --cov=custom_components/polygonal_zones --cov-report=term --cov-fail-under=98

  pytest-floor:
    # Separate job so the existing "Pytest" required status check stays
    # stable for branch protection while we gain floor-version coverage.
    # Catches HA API usage that only works on newer minor versions — the
    # class of regression that drove v1.8.0's runtime_data migration.
    #
    # The floor is hacs.json's "homeassistant" field — the same value HACS
    # itself enforces at install time (CLAUDE.md: "Home Assistant: test
    # against current stable" — declare the oldest HA supported and test
    # against it). Read from there rather than a second hard-coded copy, so
    # bumping the declared floor can't silently stop being tested.
    name: Pytest (HA floor)
    needs: [gate]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request' || needs.gate.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: pip install "homeassistant==$(jq -r .homeassistant hacs.json)"
      - run: pytest --cov=custom_components/polygonal_zones --cov-report=term --cov-fail-under=98

  mypy:
    name: Mypy
    needs: [gate]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request' || needs.gate.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: mypy

  # CLAUDE.md "Home Assistant: test against current stable" (set 2026-09-25):
  # the declared floor must never be newer than the .1 release of the month
  # before current stable, because current stable moves every month and a
  # floor that was compliant silently stops being — so this runs on every
  # push/PR and re-checks on the nightly gate whenever upstream moves, not
  # just when this repo's own files change.
  ha-floor-lag:
    name: HA floor within lag bound
    needs: [gate]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request' || needs.gate.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check hacs.json's declared floor against the current-stable-derived bound
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check packaging
          python3 - <<'PY'
          import json, urllib.request
          from packaging.version import Version

          req = urllib.request.Request(
              "https://version.home-assistant.io/stable.json",
              headers={"User-Agent": "Homeassistant-polygonal-zones-CI"},
          )
          stable = json.load(urllib.request.urlopen(req, timeout=30))
          current = Version(stable["homeassistant"]["default"])

          year, month = current.release[0], current.release[1]
          if month == 1:
              bound_year, bound_month = year - 1, 12
          else:
              bound_year, bound_month = year, month - 1
          bound = Version(f"{bound_year}.{bound_month}.1")

          floor = Version(json.load(open("hacs.json"))["homeassistant"])

          print(f"Current stable: {current}; bound (month before, .1): {bound}; declared floor: {floor}")
          if floor > bound:
              raise SystemExit(
                  f"hacs.json's declared floor {floor} is newer than the allowed bound {bound} "
                  f"(current stable {current}) - CLAUDE.md 'Home Assistant: test against current stable'"
              )
          PY

  # Record this upstream fingerprint as tested — only on a gated run where every
  # job passed. A failed nightly is NOT recorded, so it keeps re-alerting nightly
  # until fixed rather than caching a broken fingerprint and going silently green.
  record:
    needs: [gate, hassfest, hacs, ruff, prettier, pytest, pytest-floor, mypy, ha-floor-lag]
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.gate.outputs.changed == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ needs.gate.outputs.cache_key }}" > .upstream-fingerprint
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .upstream-fingerprint
          key: ${{ needs.gate.outputs.cache_key }}
