name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# Concurrency groups are repo-global, not workflow-scoped, so the key includes
# github.workflow to avoid colliding with other workflows' groups. Only PR runs
# cancel in place: cancelling a push-to-main run would leave that squash-merge
# SHA without a passing Validate run, and release.yml refuses to release a SHA
# with zero successful Validate runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  # On schedule/dispatch, decide whether upstream (latest in-range HA + shapely)
  # has changed since the last passing nightly. push/PR never gate — code changes
  # always get the full suite (these jobs are the branch-protection required checks).
  gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_upstream-gate.yml
    with:
      cache_prefix: validate

  hassfest:
    name: Hassfest
    needs: [gate]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request' || needs.gate.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The upstream action runs ghcr.io/home-assistant/hassfest with no tag, so a SHA
      # pin on it fixes nothing. Run the image by digest instead (its :latest on
      # 2026-10-22); bump the digest by hand when hassfest needs a newer rule set.
      - uses: docker://ghcr.io/home-assistant/hassfest@sha256:fed7efe49609f5bd289a2ddfbae28fa49965882b4cf158eb88828f0c0674e41b

  hacs:
    name: HACS
    needs: [gate]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request' || needs.gate.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # hacs/action, pinned by digest instead of its moving :main tag. Held here on
      # purpose: the next digest adds a brands check that needs our domain listed in
      # home-assistant/brands first. Bump it once that lands.
      - uses: docker://ghcr.io/hacs/action@sha256:187499a09c5d41f9f0d42ff80d203ed87b974c028290140913b61e005fb0aab2
        with:
          category: integration
          comment: "false"
          github_token: ${{ github.token }}

  ruff:
    name: Ruff (lint + format)
    needs: [gate]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request' || needs.gate.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: "check --output-format=github"
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: "format --check --diff"

  prettier:
    name: Prettier
    needs: [gate]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request' || needs.gate.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # Exact version, install scripts off: npx otherwise runs whatever the registry
      # serves for 3.x, with its lifecycle scripts, on every push. Renovate has no
      # manager for npx, so bump the version here by hand.
      - run: npx --yes prettier@3.9.10 --check "**/*.{json,yaml,yml,md}"
        env:
          npm_config_ignore_scripts: "true"

  pytest:
    name: Pytest
    needs: [gate]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request' || needs.gate.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: pytest --cov=custom_components/polygonal_zones --cov-report=term --cov-fail-under=98

  pytest-floor:
    # Its own job, so the "Pytest" required check stays stable while floor coverage
    # is added. Catches API usage that only works on newer minors. The floor is
    # hacs.json's field, the value HACS enforces, read from there so a bump cannot go
    # untested.
    name: Pytest (HA floor)
    needs: [gate]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request' || needs.gate.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: pip install "homeassistant==$(jq -r .homeassistant hacs.json)"
      - run: pytest --cov=custom_components/polygonal_zones --cov-report=term --cov-fail-under=98

  # Real-hass suite (tests_hass/) with its own install: pytest-homeassistant-custom-
  # component pins one exact HA version, which would fight the other pytest jobs in a
  # shared venv. Not required, and outside the upstream-fingerprint gate: the version
  # it exercises is that package's, not this repo's declared range.
  pytest-hass:
    name: Pytest (real hass)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test_hass.txt
      - run: pip install -r requirements_test_hass.txt
      - run: pip install "$(grep -E '^shapely' requirements_test.txt)"
      - run: pytest tests_hass -p homeassistant

  comments:
    name: Comment length
    needs: [gate]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request' || needs.gate.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # One rule, measured: no code comment block over 50 words. Stdlib only.
      - run: python scripts/check_comment_length.py custom_components tests tests_hass

  mypy:
    name: Mypy
    needs: [gate]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request' || needs.gate.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: mypy

  # Policy "test against current stable": the declared floor must never be newer than
  # the .1 release of the month before current stable. Stable moves monthly, so this
  # runs on every push and PR, and the nightly gate re-checks it when upstream moves.
  ha-floor-lag:
    name: HA floor within lag bound
    needs: [gate]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request' || needs.gate.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check hacs.json's declared floor against the current-stable-derived bound
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check packaging
          python3 - <<'PY'
          import json, urllib.request
          from packaging.version import Version

          req = urllib.request.Request(
              "https://version.home-assistant.io/stable.json",
              headers={"User-Agent": "Homeassistant-polygonal-zones-CI"},
          )
          stable = json.load(urllib.request.urlopen(req, timeout=30))
          current = Version(stable["homeassistant"]["default"])

          year, month = current.release[0], current.release[1]
          if month == 1:
              bound_year, bound_month = year - 1, 12
          else:
              bound_year, bound_month = year, month - 1
          bound = Version(f"{bound_year}.{bound_month}.1")

          floor = Version(json.load(open("hacs.json"))["homeassistant"])

          print(f"Current stable: {current}; bound (month before, .1): {bound}; declared floor: {floor}")
          if floor > bound:
              raise SystemExit(
                  f"hacs.json's declared floor {floor} is newer than the allowed bound {bound} "
                  f"(current stable {current}) - project policy: test against current stable"
              )
          PY

  # Record this upstream fingerprint as tested — only on a gated run where every
  # job passed. A failed nightly is NOT recorded, so it keeps re-alerting nightly
  # until fixed rather than caching a broken fingerprint and going silently green.
  record:
    needs: [gate, hassfest, hacs, ruff, prettier, pytest, pytest-floor, comments, mypy, ha-floor-lag]
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.gate.outputs.changed == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ needs.gate.outputs.cache_key }}" > .upstream-fingerprint
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .upstream-fingerprint
          key: ${{ needs.gate.outputs.cache_key }}
