name: Upstream gate (reusable)

# Answers one question for the scheduled/dispatched workflows: has the integration's
# *operating exposure* — the latest in-range `homeassistant` + `shapely` on PyPI —
# changed since the last time a nightly passed against it? Callers use the `changed`
# output to skip their heavy jobs when nothing upstream moved (re-running against the
# same versions + same code can only reproduce the last result). Not run on its own.
#
# The "already tested" marker is an actions/cache entry keyed by the fingerprint. The
# caller records it *only when its heavy jobs pass* — so a real upstream break keeps
# re-alerting every night until it's fixed, instead of caching the broken fingerprint
# and going silently green.

on:
  workflow_call:
    inputs:
      cache_prefix:
        description: "Per-caller cache namespace so one workflow's pass doesn't silence another"
        required: true
        type: string
    outputs:
      changed:
        description: "true when this upstream fingerprint has not yet been recorded as passing"
        value: ${{ jobs.gate.outputs.changed }}
      cache_key:
        description: "the cache key the caller must save (on success) to mark this fingerprint tested"
        value: ${{ jobs.gate.outputs.cache_key }}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
      cache_key: ${{ steps.fp.outputs.cache_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve upstream fingerprint (latest in-range homeassistant + shapely)
        id: fp
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check packaging
          fp=$(python3 - <<'PY'
          import json, urllib.request
          from packaging.requirements import Requirement
          from packaging.specifiers import SpecifierSet
          from packaging.version import Version

          # requirements_test.txt is the single source of truth for these ranges
          # (Renovate tracks it via pip_requirements). Reading it here, instead
          # of hard-coding the ranges in this workflow, is what lets a Renovate
          # cap bump (<2027 -> <2028) actually reach this fingerprint — a
          # hard-coded copy is invisible to Renovate and would silently keep
          # testing the old major forever.
          specs = {}
          with open("requirements_test.txt") as f:
              for line in f:
                  line = line.split("#", 1)[0].strip()
                  if not line:
                      continue
                  try:
                      req = Requirement(line)
                  except Exception:
                      continue
                  specs[req.name] = str(req.specifier)


          def latest(pkg, spec):
              url = f"https://pypi.org/pypi/{pkg}/json"
              data = json.load(urllib.request.urlopen(url, timeout=30))
              spec_set = SpecifierSet(spec)
              best = None
              for ver, files in data["releases"].items():
                  if not files:  # yanked / no artifacts
                      continue
                  try:
                      parsed = Version(ver)
                  except Exception:
                      continue
                  if parsed.is_prerelease:
                      continue
                  if str(parsed) in spec_set and (best is None or parsed > best):
                      best = parsed
              return str(best)


          ha = latest("homeassistant", specs["homeassistant"])
          sh = latest("shapely", specs["shapely"])
          print(f"ha{ha}-sh{sh}")
          PY
          )
          key="upstream-tested-${{ inputs.cache_prefix }}-$fp"
          echo "cache_key=$key" >> "$GITHUB_OUTPUT"
          echo "Upstream fingerprint: $fp  (cache key: $key)"

      - name: Has this fingerprint already passed a nightly?
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .upstream-fingerprint
          key: ${{ steps.fp.outputs.cache_key }}
          lookup-only: true

      - name: Decide
        id: decide
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Upstream unchanged (${{ steps.fp.outputs.cache_key }}) since the last passing nightly — heavy jobs will be skipped."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::New/untested upstream (${{ steps.fp.outputs.cache_key }}) — heavy jobs will run."
          fi
