name: Multi-arch smoke

# This integration ships as pure-Python files copied into custom_components/ —
# there is no Docker image to build (HACS/HA Supervisor never pulls an image
# for an integration). The only architecture-sensitive surface is the native
# runtime dependency `shapely` (a C extension over GEOS). This workflow proves
# shapely resolves an installable wheel and its geometry ops work on the
# architectures we can validate from PyPI, using QEMU emulation. It is
# intentionally NOT a multi-arch image build — there is nothing here to
# containerise.
#
# Scope note — why no 32-bit armv7 leg: shapely publishes no armv7 (linux_armv7l)
# wheel on PyPI, and neither does its build dep numpy for current CPython, so a
# PyPI install on armv7 would force a full numpy+shapely source compile under
# emulation — minutes-to-tens-of-minutes and fragile. More importantly it would
# not represent production: Home Assistant installs armv7 wheels from its own
# index (wheels.home-assistant.io), never PyPI, so a PyPI-based smoke can't
# validate armv7 either way. amd64 + arm64 (which DO ship PyPI wheels) cover the
# wheel-availability signal that actually matters here.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# See validate.yml for why the key includes github.workflow and why
# cancel-in-progress is PR-only.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On schedule/dispatch, skip the (slow, QEMU-emulated) smoke unless upstream
  # moved. push/PR always run.
  gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_upstream-gate.yml
    with:
      cache_prefix: multiarch

  # Cheap file check so PR/push runs only pay the QEMU-emulated arm64 tax when
  # a change could plausibly move the shapely wheel/version resolved (amd64
  # runs natively and stays unconditional — see shapely-import's `if:` below).
  # Fails safe: if the diff can't be computed, treat it as relevant rather
  # than silently skipping arm64 coverage.
  changed_files:
    name: Detect shapely-relevant changes
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      shapely_relevant: ${{ steps.check.outputs.relevant }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2

      - id: check
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::notice::Cannot resolve base commit $base — defaulting to relevant=true"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" "$head" | grep -qE '(^|/)(manifest\.json|requirements_test\.txt)$|^\.github/workflows/multi-arch\.yml$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  shapely-import:
    name: shapely import (${{ matrix.platform }})
    needs: [gate, changed_files]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request' || needs.gate.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
          - platform: linux/arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # matrix isn't available in a job-level `if:`, so the arm64/PR-push skip
      # is decided here and applied to the actual (expensive) steps below.
      - name: Determine whether this leg runs
        id: leg
        run: |
          if [ "${{ matrix.platform }}" = "linux/arm64" ] \
              && { [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "push" ]; } \
              && [ "${{ needs.changed_files.outputs.shapely_relevant }}" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable QEMU for cross-architecture emulation
        if: steps.leg.outputs.run == 'true'
        run: docker run --privileged --rm tonistiigi/binfmt --install all

      - name: Import shapely on ${{ matrix.platform }}
        if: steps.leg.outputs.run == 'true'
        run: |
          docker run --rm --platform=${{ matrix.platform }} \
            -v "$PWD:/src" -w /src python:3.14-slim \
            bash -euxc 'pip install --quiet "shapely>=2.1.2,<3" && python tests/smoke/shapely_smoke.py'

  # Record the tested fingerprint only when the smoke passed (see _upstream-gate.yml).
  record:
    needs: [gate, shapely-import]
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.gate.outputs.changed == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ needs.gate.outputs.cache_key }}" > .upstream-fingerprint
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .upstream-fingerprint
          key: ${{ needs.gate.outputs.cache_key }}
