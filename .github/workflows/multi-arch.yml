name: Multi-arch smoke

# This integration ships as pure-Python files copied into custom_components/ —
# there is no Docker image to build (HACS/HA Supervisor never pulls an image
# for an integration). The only architecture-sensitive surface is the native
# runtime dependency `shapely` (a C extension over GEOS). This workflow proves
# shapely resolves an installable wheel and its geometry ops work on the
# architectures we can validate from PyPI, using QEMU emulation. It is
# intentionally NOT a multi-arch image build — there is nothing here to
# containerise.
#
# Scope note — why no 32-bit armv7 leg: shapely publishes no armv7 (linux_armv7l)
# wheel on PyPI, and neither does its build dep numpy for current CPython, so a
# PyPI install on armv7 would force a full numpy+shapely source compile under
# emulation — minutes-to-tens-of-minutes and fragile. More importantly it would
# not represent production: Home Assistant installs armv7 wheels from its own
# index (wheels.home-assistant.io), never PyPI, so a PyPI-based smoke can't
# validate armv7 either way. amd64 + arm64 (which DO ship PyPI wheels) cover the
# wheel-availability signal that actually matters here.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  shapely-import:
    name: shapely import (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
          - platform: linux/arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Enable QEMU for cross-architecture emulation
        run: docker run --privileged --rm tonistiigi/binfmt --install all

      - name: Import shapely on ${{ matrix.platform }}
        run: |
          docker run --rm --platform=${{ matrix.platform }} \
            -v "$PWD:/src" -w /src python:3.14-slim \
            bash -euxc 'pip install --quiet "shapely>=2.0,<3" && python tests/smoke/shapely_smoke.py'
