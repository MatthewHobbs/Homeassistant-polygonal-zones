name: Playwright config-flow smoke

# Boots a REAL Home Assistant instance in CI, installs this integration into
# its custom_components/, and drives the "Add Integration -> Polygonal Zones"
# config flow in a browser. This exercises the actual frontend rendering of
# config_flow.py + strings.json + translations + manifest.json — surfaces that
# the pytest suite never renders (it uses HA's Python test harness, not the
# real UI).
#
# It is heavyweight (full HA boot + Chromium) and not wired into branch
# protection, so it can NEVER block a merge. It runs nightly, on demand, and on
# pull requests (as a non-blocking, continue-on-error signal so a config-flow
# regression surfaces same-day instead of in the next nightly run).
# The first runs are expected to need tuning — see tests/e2e/README.md.

on:
  schedule:
    - cron: "30 3 * * *"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# See validate.yml for why the key includes github.workflow and why
# cancel-in-progress is PR-only.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On schedule/dispatch, skip this heavyweight (full HA + Chromium) smoke unless
  # upstream moved. push/PR always run.
  gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_upstream-gate.yml
    with:
      cache_prefix: playwright

  config-flow:
    name: Config flow (Playwright)
    needs: [gate]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request' || needs.gate.outputs.changed == 'true') }}
    uses: ./.github/workflows/_playwright-config-flow.yml
    with:
      # Non-blocking on PRs only: this heavyweight smoke must never fail a PR
      # (it is not a required check). Scheduled/manual runs keep failing
      # visibly so the nightly signal isn't lost.
      continue_on_error: ${{ github.event_name == 'pull_request' }}

  # Record the tested fingerprint only when the smoke passed (see _upstream-gate.yml).
  # On schedule, continue-on-error is false, so a failed smoke leaves the fingerprint
  # unrecorded and it re-runs next night until fixed.
  record:
    needs: [gate, config-flow]
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.gate.outputs.changed == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ needs.gate.outputs.cache_key }}" > .upstream-fingerprint
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .upstream-fingerprint
          key: ${{ needs.gate.outputs.cache_key }}
